name: Build and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # persist-credentials MUST stay false. Otherwise checkout writes an
      # http.https://github.com/.extraheader into .git/config carrying the job's
      # GITHUB_TOKEN, which is scoped to THIS repo only. That header overrides the
      # credentials embedded in MATCH_GIT_URL, so every git call fastlane match
      # makes against the private certs repo comes back "Repository not found" —
      # a permission error wearing the costume of a missing repo. Cost: 4 red runs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Must be Xcode 26 or newer: App Store Connect rejects the upload otherwise
      # ("built with the iOS 26 SDK or later ... in order to be uploaded", 409).
      # The build and the signing both pass on older Xcode, so this only shows up
      # at the very last step. Newest first, falling back through the versions the
      # macos-15 image ships.
      - name: Pin Xcode
        run: |
          for v in 26.3 26.2 26.1.1 26.0.1; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::no Xcode 26.x found on this runner image"
          ls -d /Applications/Xcode*.app
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > fastlane/AuthKey.p8

      - name: Build, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/ninioori-boop/mipuy-ios-certs.git
        run: |
          # `set +e` is load-bearing: the default shell is `bash -e`, so without it
          # the script dies on the failing command and never reaches the reporting
          # lines below. That is why runs 3-7 produced no fastlane annotation at all.
          set +e
          bundle exec fastlane beta > fastlane.log 2>&1 &
          FL=$!
          # Heartbeat: a cancelled job never reaches the reporting block below, so
          # run 10 timed out after 45 minutes and told us nothing about where it
          # stalled. Annotations are emitted as they are printed, so these survive.
          while kill -0 $FL 2>/dev/null; do
            sleep 120
            echo "::warning::progress $(date -u +%H:%M) :: $(tail -2 fastlane.log | tr '\n' ' ' | tail -c 300)"
          done
          wait $FL
          status=$?
          tail -80 fastlane.log
          if [ $status -ne 0 ]; then
            echo "::error::fastlane: $(grep -aE '\[!\]|rror|Could not|denied|Unable|No profile|signing|Provisioning' fastlane.log | tail -15 | tr '\n' ' ~ ')"
          fi
          exit $status

      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 'MARKETING_VERSION' project.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          files: build/Hakalkalan.ipa
