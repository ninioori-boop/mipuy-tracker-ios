name: Build and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # persist-credentials MUST stay false. Otherwise checkout writes an
      # http.https://github.com/.extraheader into .git/config carrying the job's
      # GITHUB_TOKEN, which is scoped to THIS repo only. That header overrides the
      # credentials embedded in MATCH_GIT_URL, so every git call fastlane match
      # makes against the private certs repo comes back "Repository not found" —
      # a permission error wearing the costume of a missing repo. Cost: 4 red runs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > fastlane/AuthKey.p8

      # Diagnostics only. The log archive needs repo-admin rights to download, but
      # ::warning:: / ::error:: lines land in the check-run annotations, which are
      # readable without them. Remove once the pipeline is green.
      - name: Diagnose signing prerequisites
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          set +e
          for n in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID MATCH_PASSWORD MATCH_GIT_TOKEN; do
            case "$n" in
              ASC_KEY_ID)       v="${{ secrets.ASC_KEY_ID }}" ;;
              ASC_ISSUER_ID)    v="${{ secrets.ASC_ISSUER_ID }}" ;;
              APPLE_TEAM_ID)    v="${{ secrets.APPLE_TEAM_ID }}" ;;
              MATCH_PASSWORD)   v="${{ secrets.MATCH_PASSWORD }}" ;;
              MATCH_GIT_TOKEN)  v="${{ secrets.MATCH_GIT_TOKEN }}" ;;
            esac
            echo "::warning::secret $n length=${#v}"
          done
          echo "::warning::AuthKey.p8 bytes=$(wc -c < fastlane/AuthKey.p8) firstline=$(head -c 27 fastlane/AuthKey.p8)"
          OUT=$(git ls-remote "https://x-access-token:${MATCH_GIT_TOKEN}@github.com/ninioori-boop/mipuy-ios-certs.git" 2>&1)
          CODE=$?
          echo "::warning::certs repo ls-remote exit=$CODE msg=$(echo "$OUT" | head -3 | tr '\n' ' ')"

      - name: Build, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/ninioori-boop/mipuy-ios-certs.git
        run: |
          set -o pipefail
          bundle exec fastlane beta 2>&1 | tee fastlane.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::fastlane tail: $(grep -E '\[!\]|error|Error|Could not|denied|401|403|404' fastlane.log | tail -12 | tr '\n' ' ~ ')"
          fi
          exit $status

      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 'MARKETING_VERSION' project.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          files: build/Hakalkalan.ipa
