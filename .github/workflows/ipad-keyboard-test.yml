name: iPad keyboard check

# Deliberately NOT on main. release.yml triggers on main and ships to
# TestFlight; this branch-only trigger keeps a diagnostic run from ever
# touching that lane.
on:
  push:
    branches: [ci/ipad-keyboard-test]
  workflow_dispatch:

# Needed by the final step, which reports the outcome back as a tag.
permissions:
  contents: write

jobs:
  keyboard:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: |
          for v in 26.3 26.2 26.1.1 26.0.1; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::no Xcode 26.x found on this runner image"
          ls -d /Applications/Xcode*.app
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The app declares TARGETED_DEVICE_FAMILY = 1 (iPhone only). Whether
      # xcodebuild will even ACCEPT an iPad simulator as a destination is the
      # open question of this whole run, so print the answer rather than assume
      # it either way.
      - name: Destinations an iPhone-only app actually offers
        run: xcodebuild -project Hakalkalan.xcodeproj -scheme UITests -showdestinations 2>&1 | tail -40

      - name: Simulators on this runner
        run: xcrun simctl list devices available | grep -E 'iPhone|iPad' | head -30

      # 🔴 Load-bearing. By default the simulator types through the Mac's own
      # keyboard and the on-screen one never draws — which would let this test
      # pass while proving nothing about the exact thing Apple reported.
      - name: Force the software keyboard
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          echo "ConnectHardwareKeyboard = $(defaults read com.apple.iphonesimulator ConnectHardwareKeyboard 2>/dev/null || echo unset)"

      - name: Pick one of each
        id: sims
        run: |
          IPHONE=$(xcrun simctl list devices available | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' | sed 's/ *$//' | tail -1)
          IPAD=$(xcrun simctl list devices available | sed -n 's/^ *\(iPad [^(]*\) (.*/\1/p' | sed 's/ *$//' | tail -1)
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"
          echo "iPhone: [$IPHONE]"
          echo "iPad:   [$IPAD]"

      # Baseline. This half is the one that can answer definitively, and it
      # covers code written today that nothing had run: does the form focus its
      # own first field, and does typing land?
      - name: iPhone
        id: iphone
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hakalkalan.xcodeproj \
            -scheme UITests \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.iphone }}" \
            FIREBASE_API_KEY=ci-dummy-key \
            CODE_SIGNING_ALLOWED=NO \
            > iphone.log 2>&1 || STATUS=$?
          grep -E "Test Case .*(passed|failed)|XCTAssert|error:|Testing failed" iphone.log | head -30
          tail -25 iphone.log
          exit ${STATUS:-0}

      # The real question. Allowed to fail: a refusal here is itself the finding
      # (an iPhone-only app may simply not be installable on an iPad simulator),
      # and it must not be reported as "the keyboard is broken".
      - name: iPad
        id: ipad
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hakalkalan.xcodeproj \
            -scheme UITests \
            -destination "platform=iOS Simulator,name=${{ steps.sims.outputs.ipad }}" \
            FIREBASE_API_KEY=ci-dummy-key \
            CODE_SIGNING_ALLOWED=NO \
            > ipad.log 2>&1 || STATUS=$?
          echo "=== exit ${STATUS:-0} ==="
          grep -E "Test Case .*(passed|failed)|XCTAssert|error:|Unsupported|not.*valid destination|Testing failed" ipad.log | head -30
          tail -30 ipad.log
          exit ${STATUS:-0}

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-check-logs
          path: "*.log"
          if-no-files-found: ignore

      # The repo is private and this workstation has no gh CLI, so an Actions
      # result is unreadable from there. An annotated tag is: `git ls-remote`
      # finds it and `git fetch` brings the message with it. Same reason the
      # release tags are how build success gets reported.
      - name: Report the outcome as a tag
        if: always()
        run: |
          {
            echo "iphone=${{ steps.iphone.outcome }} ipad=${{ steps.ipad.outcome }}"
            echo "---"
            grep -hE "Test Case .*(passed|failed)|XCTAssert|Unsupported|valid destination|Testing failed|error:" \
              iphone.log ipad.log 2>/dev/null | head -14
          } > tagmsg.txt
          cat tagmsg.txt
          git config user.name  "CI"
          git config user.email "actions@github.com"
          git tag -a "kbcheck-${{ github.run_number }}" -F tagmsg.txt
          git push origin "kbcheck-${{ github.run_number }}"
