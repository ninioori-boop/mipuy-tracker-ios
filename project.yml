# XcodeGen project definition — the .xcodeproj is GENERATED in CI (xcodegen generate).
# Nobody on this team has a Mac; this file is the single source of truth.
name: Hakalkalan
options:
  bundleIdPrefix: com.orimipuy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual

targets:
  Hakalkalan:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "הכלכלן של הבית"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.orimipuy.hakalkalan
            CFBundleURLSchemes:
              - mipuytracker
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "התראה על כל הוצאה שנקלטת, כולל מצב התקציב"
    entitlements:
      path: App/Hakalkalan.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orimipuy.hakalkalan
        PRODUCT_NAME: Hakalkalan
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.orimipuy.hakalkalan"
        CODE_SIGN_IDENTITY: "Apple Distribution"
