# XcodeGen project definition — the .xcodeproj is GENERATED in CI (xcodegen generate).
# Nobody on this team has a Mac; this file is the single source of truth.
name: Hakalkalan
options:
  bundleIdPrefix: com.orimipuy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    # Overridden in CI from the FIREBASE_API_KEY secret (see fastlane/Fastfile).
    # Empty here on purpose: the repo holds no API keys, and an empty value makes
    # the app fall back to the in-app sign-in sheet instead of showing a password
    # form that could never work.
    FIREBASE_API_KEY: ""

targets:
  Hakalkalan:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "הכלכלן של הבית"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.orimipuy.hakalkalan
            CFBundleURLSchemes:
              - mipuytracker
        # Read back at run time by Config.firebaseAPIKey. Build settings are
        # expanded during Info.plist processing, the same mechanism the two
        # version strings above rely on.
        FirebaseAPIKey: "$(FIREBASE_API_KEY)"
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "התראה על כל הוצאה שנקלטת, כולל מצב התקציב"
    entitlements:
      path: App/Hakalkalan.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orimipuy.hakalkalan
        PRODUCT_NAME: Hakalkalan
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.orimipuy.hakalkalan"
        CODE_SIGN_IDENTITY: "Apple Distribution"

  # Simulator-only. Never built by the release lane, which archives the
  # Hakalkalan scheme; signing is switched off here so the Manual style
  # inherited from the global settings cannot ask it for a profile it has no
  # reason to own.
  HakalkalanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Hakalkalan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orimipuy.hakalkalan.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hakalkalan
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

# A scheme of its own, deliberately NOT named Hakalkalan: fastlane archives
# `-scheme Hakalkalan`, and redefining that scheme here to carry a test action
# would put the release lane at risk for the sake of a check that runs nowhere
# near it.
schemes:
  UITests:
    build:
      targets:
        Hakalkalan: [run, test]
        HakalkalanUITests: [test]
    test:
      targets:
        - HakalkalanUITests
